<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e8e8ec" />
    </linearGradient>
    <linearGradient id="ink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#3f3f46" />
    </linearGradient>
  </defs>
  <!-- Crisp Swiss gallery-white squircle canvas (zero heavy black slab) -->
  <rect width="512" height="512" rx="116" fill="url(#paper)" />
  <!-- Bold globe sphere outline -->
  <circle cx="256" cy="256" r="134" fill="none" stroke="url(#ink)" stroke-width="26" />
  <!-- Bold sculptural tilted orbit -->
  <ellipse cx="256" cy="256" rx="194" ry="78" transform="rotate(-28 256 256)" fill="none" stroke="url(#ink)" stroke-width="24" />
  <!-- Central nucleus -->
  <circle cx="256" cy="256" r="38" fill="#18181b" />
  <!-- Signature muted-crimson beacon -->
  <circle cx="408" cy="176" r="30" fill="#a84646" />
</svg>
