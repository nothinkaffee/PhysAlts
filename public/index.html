<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050506" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PhysALT" />
  <meta name="description" content="PhysALT — Interactive 3D atlas of global Physics, AI, Math, Biology, Chemistry, Climate & Engineering labs, universities, startups, historical discoveries (1800 BCE–2045), offline packs, and space missions to 1 light-day." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="PhysALT" />
  <meta property="og:description" content="Explore official STEM & AI labs, universities, startups, ShanghaiRanking-inspired impact leaders, historical milestones, offline packages, and space missions out to 1 light-day." />
  <title>PhysALT</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=2" />
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png?v=2" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=2" />
  <link rel="preconnect" href="https://services.arcgisonline.com" crossorigin />
  <link rel="preload" href="./vendor/inter-var.woff2" as="font" type="font/woff2" crossorigin />
  <link href="./vendor/maplibre-gl.css" rel="stylesheet" />
  <link href="./vendor/tailwind.css" rel="stylesheet" />
  <link href="./styles/app.css" rel="stylesheet" />
  <script src="./vendor/lucide.min.js"></script>
  <script src="./vendor/maplibre-gl-csp.js"></script>
</head>
<body>
  <!-- Living Deep-Space Starfield Backdrop -->
  <canvas id="space-bg-canvas" aria-hidden="true"></canvas>

  <!-- 3D Earth Satellite Globe -->
  <div id="map" aria-label="Interactive 3D Satellite Science & STEM Globe"></div>

  <!-- Space Frontier View: Earth (0 ls) → Moon → Planets → Voyager (~1 Light-Day) -->
  <div id="space-frontier-view" class="space-hidden" aria-label="Space Frontier Explorer from Earth to 1 Light-Day">
    <canvas id="space-canvas" class="w-full h-full block"></canvas>

    <!-- Space Zone Filter Bar centered neatly below Dynamic Island -->
    <div id="space-zone-bar" class="fixed inset-x-0 top-[92px] z-20 flex justify-center px-3 sm:px-5 pointer-events-none">
      <div id="space-zone-pills" class="pointer-events-auto liquid-pill rounded-full px-2 py-1.5 flex items-center gap-1.5 overflow-x-auto no-scrollbar max-w-full"></div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" role="status" aria-live="polite" class="liquid-pill rounded-full px-4 py-2 text-[14px] font-medium text-white max-w-[min(420px,calc(100vw-32px))] truncate">
    <span id="toast-text">Ready</span>
  </div>

  <!-- SCULPTURAL SYMMETRICAL DYNAMIC ISLAND -->
  <header id="dynamic-island" class="liquid-pill">
    <div class="island-inner">
      <!-- Left Zone: Search + Rabbit Hole -->
      <div class="island-zone island-left">
        <button id="btn-open-spotlight" type="button" title="Search hubs, AI, STEM, or Deep Research (⌘K or /)" aria-label="Search atlas" class="glass-btn island-btn">
          <i data-lucide="search" class="w-4 h-4 text-neutral-300 shrink-0"></i>
          <span class="island-label-sm text-neutral-200 whitespace-nowrap">Search</span>
          <kbd class="island-kbd">⌘K</kbd>
        </button>

        <button id="btn-rabbit-hole" type="button" title="Rabbit Hole — Surprise discovery, curated journeys & official deep research (R)" aria-haspopup="dialog" aria-expanded="false" class="glass-btn island-btn island-rabbit-btn">
          <i data-lucide="shuffle" class="w-4 h-4 accent-text shrink-0"></i>
          <span class="island-label-sm font-medium text-white whitespace-nowrap">Rabbit Hole</span>
        </button>
      </div>

      <!-- Center Zone: Earth | 1 Light-Day -->
      <div class="island-zone island-center">
        <div class="island-mode-track" role="tablist" aria-label="View mode">
          <button id="btn-mode-earth" type="button" role="tab" aria-selected="true" title="Earth Globe (click again to reset view)" class="glass-btn-active island-mode-btn">
            <i data-lucide="globe" class="w-4 h-4 shrink-0"></i>
            <span class="island-mode-label">Earth</span>
          </button>
          <button id="btn-mode-space" type="button" role="tab" aria-selected="false" title="Space Frontier (0 to 1 Light-Day)" class="glass-btn island-mode-btn">
            <i data-lucide="orbit" class="w-4 h-4 shrink-0"></i>
            <span class="island-mode-label">1 Light-Day</span>
          </button>
        </div>
      </div>

      <!-- Right Zone: Precision Filters + Account -->
      <div class="island-zone island-right">
        <button id="btn-open-filters" type="button" title="Filter by STEM discipline, subfield, type, country, ranking, or offline packs (F)" aria-haspopup="dialog" aria-expanded="false" class="glass-btn island-btn">
          <i data-lucide="sliders-horizontal" class="w-4 h-4 text-neutral-300 shrink-0"></i>
          <span class="island-label-md whitespace-nowrap text-neutral-200">Filters</span>
          <span id="filter-count-badge" class="hidden island-count-badge">0</span>
        </button>

        <button id="btn-account" type="button" title="Account &amp; Bookmarks" class="glass-btn island-btn island-account-btn">
          <span id="account-avatar" class="hidden w-5 h-5 rounded-full bg-white text-black text-[12px] font-semibold items-center justify-center shrink-0"></span>
          <i id="account-guest-icon" data-lucide="user" class="w-4 h-4 text-neutral-300 shrink-0"></i>
          <span id="account-btn-label" class="island-label-sm whitespace-nowrap font-medium text-white">Sign in</span>
          <span id="account-bm-badge" class="hidden island-bm-badge">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Sleek Rabbit Hole Popover (Surprise Me, Official Deep Research & Curated STEM Trails) -->
  <section id="rabbit-popover" role="dialog" aria-label="Rabbit Hole Explorer" class="hidden atlas-popover atlas-popover-rabbit liquid-glass">
    <div class="flex items-center justify-between gap-2 shrink-0">
      <div class="text-[15px] font-semibold text-white">Rabbit Hole</div>
      <div class="flex items-center gap-2">
        <button id="btn-rabbit-surprise" type="button" class="glass-btn-active rounded-full px-3.5 py-1.5 text-[13px] inline-flex items-center gap-1.5">
          <i data-lucide="shuffle" class="w-3.5 h-3.5 shrink-0"></i>
          <span>Surprise Me</span>
        </button>
        <button id="btn-close-rabbit-popover" type="button" aria-label="Close Rabbit Hole" class="glass-btn rounded-full w-8 h-8 flex items-center justify-center text-[13px] shrink-0">✕</button>
      </div>
    </div>

    <form id="rabbit-agent-form" class="flex items-center gap-2 shrink-0">
      <input id="rabbit-agent-input" type="text" autocomplete="off" placeholder="Topic to curate (e.g. AlphaFold, CRISPR)…" class="glass-input py-2 text-[13.5px] flex-1 min-w-0" />
      <button type="submit" class="accent-chip rounded-full px-3.5 py-2 text-[13px] font-medium shrink-0 cursor-pointer">Curate →</button>
    </form>

    <div class="flex flex-col gap-1.5 flex-1 min-h-0">
      <div class="section-label shrink-0">Curated Journeys</div>
      <div id="rabbit-popover-trails" class="space-y-1.5 flex-1 min-h-0 scroll-clean pr-0.5"></div>
    </div>
  </section>

  <!-- Precision Multi-Filter Popover (non-blocking, live-filters the 3D globe) -->
  <section id="filter-popover" role="dialog" aria-label="Filter STEM Institutions" class="hidden atlas-popover atlas-popover-filter liquid-glass scroll-clean">
    <div class="flex items-center justify-between gap-2">
      <div class="min-w-0">
        <div class="text-[15px] font-semibold text-white leading-tight">Filters</div>
        <div id="filter-live-count" class="text-[12.5px] text-neutral-400 whitespace-nowrap truncate">Showing all institutions</div>
      </div>
      <div class="flex items-center gap-1.5 shrink-0">
        <button id="btn-filter-rankings" type="button" class="accent-chip rounded-full px-2.5 py-1.5 text-[12.5px] inline-flex items-center gap-1 cursor-pointer" title="Browse full ShanghaiRanking 2026 (ARWU + 57 GRAS subjects)">
          <i data-lucide="award" class="w-3.5 h-3.5 shrink-0"></i>
          <span>Rankings</span>
        </button>
        <button id="btn-filter-offline" type="button" class="glass-btn rounded-full px-2.5 py-1.5 text-[12.5px] inline-flex items-center gap-1" title="Download Organic-Maps style offline STEM & region packages (O)">
          <i data-lucide="download" class="w-3.5 h-3.5 accent-text shrink-0"></i>
          <span>Offline</span>
          <span id="offline-pack-count" class="hidden filter-chip-count">0</span>
        </button>
        <button id="btn-filter-reset" type="button" class="glass-btn rounded-full px-2.5 py-1.5 text-[12.5px]">Reset</button>
        <button id="btn-close-filter-popover" type="button" aria-label="Close filters" class="glass-btn rounded-full w-8 h-8 flex items-center justify-center text-[13px]">✕</button>
      </div>
    </div>
    <div class="space-y-1.5">
      <div class="section-label">Discipline</div>
      <div id="filter-discipline-chips" class="flex flex-wrap gap-1.5"></div>
    </div>
    <div class="space-y-1.5">
      <div class="section-label">Subfield</div>
      <div id="filter-branch-chips" class="flex flex-wrap gap-1.5"></div>
    </div>
    <div class="space-y-1.5">
      <div class="section-label">Type</div>
      <div id="filter-type-chips" class="flex flex-wrap gap-1.5"></div>
    </div>
    <div class="space-y-1 border-t border-white/10 pt-3 min-w-0">
      <div class="flex items-center justify-between gap-2">
        <label for="filter-shanghai-select" class="section-label block">ShanghaiRanking 2026 Subject</label>
        <button id="btn-open-shanghai-table" type="button" class="text-[12px] accent-link bg-transparent border-0 p-0 cursor-pointer">Full Table →</button>
      </div>
      <select id="filter-shanghai-select" class="filter-select"></select>
    </div>
    <div class="filter-bottom-grid pt-1">
      <div class="space-y-1 min-w-0">
        <label for="filter-country-select" class="section-label block">Country</label>
        <select id="filter-country-select" class="filter-select"></select>
      </div>
      <div class="space-y-1 min-w-0">
        <label for="filter-sort-select" class="section-label block">Rank By</label>
        <select id="filter-sort-select" class="filter-select">
          <option value="shanghai">ShanghaiRanking 2026</option>
          <option value="impact">PhysALT Impact Index</option>
          <option value="citations">OpenAlex Citations</option>
          <option value="founded">Oldest Founded</option>
          <option value="name">Alphabetical (A → Z)</option>
        </select>
      </div>
    </div>
    <label class="popover-toggle-row w-full">
      <span class="text-[13.5px] font-medium text-white">Curated flagships only</span>
      <input id="toggle-curated-only" type="checkbox" class="popover-checkbox" />
    </label>
  </section>

  <!-- Floating Active Filter Pill (centered cleanly below Dynamic Island) -->
  <div id="active-filter-pill" class="hidden fixed top-[76px] sm:top-[82px] left-1/2 -translate-x-1/2 z-[40] liquid-pill items-center gap-2 px-3.5 py-1.5 rounded-full text-[13px] text-neutral-100 max-w-[calc(100vw-32px)]">
    <span id="active-filter-text" class="truncate"></span>
    <button id="btn-clear-filters" type="button" class="text-neutral-400 hover:text-white cursor-pointer bg-transparent border-0 p-0 ml-1 shrink-0" aria-label="Clear all filters">✕</button>
  </div>

  <!-- CENTERED SPOTLIGHT COMMAND SEARCH WINDOW (Cmd+K / / / Search button) -->
  <div id="spotlight-backdrop" class="hidden fixed inset-0 z-[65] modal-backdrop flex items-start justify-center pt-[10vh] px-5">
    <section id="spotlight-modal" role="dialog" aria-modal="true" aria-label="Spotlight Search & Deep Rabbit-Hole Research" class="w-full max-w-[660px] max-h-[76dvh] liquid-glass rounded-[26px] flex flex-col overflow-hidden">
      <div class="px-5 py-4 border-b border-white/10 flex items-center gap-2.5 shrink-0">
        <i data-lucide="search" class="w-5 h-5 text-neutral-400 shrink-0"></i>
        <input
          id="search-input"
          type="text"
          autocomplete="off"
          aria-label="Search STEM labs, countries, eras, space missions, ShanghaiRanking subjects, or research topic"
          placeholder="Search MIT, Semiconductors, ASML, ShanghaiRanking, Voyager…"
          class="bg-transparent border-0 outline-none text-[16px] text-white placeholder-neutral-500 flex-1 min-w-0"
        />
        <button id="btn-spotlight-agent" type="button" title="Curate official reference nodes, papers & fun facts for a deep rabbit hole" class="accent-chip rounded-full px-3 py-1.5 text-[13px] font-medium inline-flex items-center gap-1.5 shrink-0 cursor-pointer">
          <i data-lucide="compass" class="w-3.5 h-3.5 shrink-0"></i>
          <span>Curate Trail</span>
        </button>
        <button id="btn-spotlight-live" type="button" class="glass-btn rounded-full px-3 py-1.5 text-[13px] shrink-0 hidden sm:inline-flex">Live Registry</button>
        <button id="btn-close-spotlight" type="button" aria-label="Close search" class="glass-btn rounded-full w-9 h-9 flex items-center justify-center text-[14px] shrink-0">✕</button>
      </div>
      <div id="search-dropdown" class="p-4 scroll-clean flex-1 space-y-2"></div>
    </section>
  </div>

  <!-- Clean Editorial Overview Card (Desktop Left Card / Mobile Bottom Sheet) -->
  <aside id="place-card" class="hidden fixed top-[84px] left-5 z-[38] liquid-glass rounded-[22px] overflow-hidden flex flex-col">
    <div class="card-sheet-handle" aria-hidden="true"></div>
    <div id="card-photo-wrap" class="hidden relative w-full bg-white/[0.03] shrink-0 overflow-hidden">
      <img id="card-photo" class="w-full h-full object-cover opacity-0 transition-opacity duration-300" alt="" />
      <div id="card-photo-fallback" class="absolute inset-0"></div>
      <div class="absolute inset-0 bg-gradient-to-t from-[#0b0b0d] via-transparent to-black/25"></div>
    </div>

    <button id="btn-close-card" type="button" aria-label="Close card" class="absolute top-3 right-3 z-10 glass-btn rounded-full w-7 h-7 flex items-center justify-center text-[13px]">✕</button>

    <div id="card-scroll-body" class="p-5 pb-4 space-y-3 scroll-clean min-w-0 flex-1">
      <button id="btn-card-stack-back" type="button" class="hidden glass-btn rounded-full px-3 py-1 text-[12.5px] inline-flex items-center gap-1.5 text-neutral-200">← Back to nearby</button>
      <div class="min-w-0">
        <div id="card-badge" class="text-[13px] font-medium accent-text pr-8 truncate"></div>
        <h2 id="card-title" class="text-[20px] font-semibold text-white leading-snug mt-0.5 pr-6 break-words"></h2>
        <div id="card-sub" class="text-[13.5px] text-neutral-400 mt-0.5 truncate"></div>
      </div>

      <p id="card-summary" class="text-[14px] text-neutral-200 leading-relaxed line-clamp-3"></p>

      <!-- Official Primary Doors -->
      <div id="card-links" class="flex flex-wrap items-center gap-x-2.5 gap-y-2 pt-0.5"></div>

      <!-- Official ShanghaiRanking 2026 (ARWU & GRAS Subject Rankings) -->
      <div id="card-shanghai-wrap" class="hidden space-y-2 pt-1 min-w-0"></div>

      <!-- Verified Collaborations & Nearby Labs / Companies Ecosystem -->
      <div id="card-ecosystem-wrap" class="hidden space-y-2.5 pt-1 min-w-0"></div>

      <!-- Compact Keep Exploring Chips -->
      <div id="card-rabbit-wrap" class="hidden space-y-2 pt-1 min-w-0">
        <div class="section-label text-[13px]">Keep Exploring</div>
        <div id="card-rabbit-links" class="flex flex-wrap gap-1.5 min-w-0"></div>
      </div>

      <div id="card-extra-chips" class="flex flex-wrap gap-1.5 min-w-0"></div>

      <!-- Optional Expanded Research Details -->
      <div id="card-deeper-wrap" class="hidden space-y-4 border-t border-white/10 pt-3.5">
        <div id="deeper-impact-wrap" class="hidden">
          <div class="section-label mb-2 text-[13px]">ShanghaiRanking 2026 & Research Impact</div>
          <div id="deeper-impact" class="space-y-2"></div>
        </div>
        <div>
          <div class="section-label mb-2 text-[13px]">Recent Papers</div>
          <div id="deeper-papers" class="space-y-2"></div>
        </div>
        <div>
          <div class="section-label mb-2 text-[13px]">Key Researchers</div>
          <div id="deeper-authors" class="space-y-2"></div>
        </div>
      </div>
    </div>

    <div class="card-actions flex items-center gap-1.5 px-4 py-2.5 border-t border-white/10 shrink-0 bg-black/25">
      <button id="btn-save-shortlist" type="button" class="glass-btn card-action" title="Bookmark">
        <i data-lucide="bookmark" class="w-3.5 h-3.5 shrink-0"></i><span>Save</span>
      </button>
      <button id="btn-card-rabbit" type="button" class="glass-btn card-action" title="Next Rabbit Hole discovery">
        <i data-lucide="shuffle" class="w-3.5 h-3.5 accent-text shrink-0"></i><span>Next</span>
      </button>
      <button id="btn-copy-link" type="button" class="glass-btn card-action" title="Copy share link">
        <i data-lucide="share-2" class="w-3.5 h-3.5 shrink-0"></i><span>Share</span>
      </button>
      <button id="btn-deeper-toggle" type="button" class="glass-btn card-action" title="More details">
        <i data-lucide="chevron-down" class="w-3.5 h-3.5 shrink-0"></i><span>More</span>
      </button>
    </div>
  </aside>

  <!-- Co-Located Institutions Picker Sheet (replaces giant unreadable 80-dot spiderfy rings!) -->
  <aside id="cluster-sheet" role="dialog" aria-label="Institutions at this location" class="hidden fixed top-[84px] left-5 z-[38] liquid-glass rounded-[22px] overflow-hidden flex flex-col">
    <div class="card-sheet-handle" aria-hidden="true"></div>
    <div class="px-5 pt-4 pb-3 border-b border-white/10 shrink-0 space-y-2.5">
      <div class="flex items-start justify-between gap-2">
        <div class="min-w-0">
          <div id="cluster-sheet-sub" class="text-[12.5px] font-medium accent-text truncate"></div>
          <h2 id="cluster-sheet-title" class="text-[18px] font-semibold text-white leading-snug truncate"></h2>
        </div>
        <button id="btn-close-cluster-sheet" type="button" aria-label="Close nearby list" class="glass-btn rounded-full w-7 h-7 flex items-center justify-center text-[13px] shrink-0">✕</button>
      </div>
      <input id="cluster-sheet-filter" type="text" autocomplete="off" placeholder="Filter nearby…" class="hidden glass-input py-1.5 text-[13.5px]" />
    </div>
    <div id="cluster-sheet-list" class="p-3 space-y-1.5 scroll-clean flex-1"></div>
  </aside>

  <!-- Floating Rabbit Hole Trail Breadcrumb Bar (visible during curated or agent-generated trails) -->
  <div id="rabbit-trail-bar" class="hidden liquid-pill" role="region" aria-label="Active Rabbit Hole Trail">
    <div class="trail-bar-meta min-w-0">
      <div class="flex items-center gap-2 min-w-0">
        <span id="trail-bar-step" class="trail-step-pill shrink-0">1 / 6</span>
        <span id="trail-bar-title" class="text-[13.5px] font-semibold text-white truncate"></span>
      </div>
      <div id="trail-bar-bridge" class="text-[12.5px] text-neutral-300 truncate mt-0.5"></div>
    </div>
    <div class="flex items-center gap-1.5 shrink-0">
      <button id="btn-trail-prev" type="button" class="glass-btn rounded-full w-8 h-8 flex items-center justify-center text-[13px]" title="Previous hop">←</button>
      <button id="btn-trail-next" type="button" class="glass-btn-active rounded-full px-3.5 py-1.5 text-[13px] whitespace-nowrap">Next Hop →</button>
      <button id="btn-trail-exit" type="button" class="glass-btn rounded-full w-8 h-8 flex items-center justify-center text-[13px]" title="Exit trail" aria-label="Exit rabbit hole trail">✕</button>
    </div>
  </div>

  <!-- Centered Chronological Timeline (1800 BCE → 2045 CE) -->
  <section id="time-bar" class="hidden fixed bottom-[96px] inset-x-0 mx-auto z-[36] w-[min(860px,calc(100vw-32px))] liquid-glass rounded-[26px] p-5 space-y-3.5" aria-label="Chronological Physics Timeline">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-baseline gap-3.5 min-w-0">
        <span id="time-year-display" class="text-[24px] font-semibold text-white tabular-nums tracking-tight shrink-0">580 BCE</span>
        <span id="time-era-title" class="text-[15px] font-medium accent-text truncate">Pre-Classical &amp; Ancient Foundations</span>
        <span id="time-visible-count" class="hidden"></span>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <button id="btn-time-prev" type="button" class="glass-btn rounded-full w-9 h-9 flex items-center justify-center text-[15px]" title="Previous">←</button>
        <button id="btn-time-play" type="button" class="glass-btn rounded-full px-4 py-1.5 text-[14px] font-medium">Play Tour</button>
        <button id="btn-time-next" type="button" class="glass-btn rounded-full w-9 h-9 flex items-center justify-center text-[15px]" title="Next">→</button>
        <button id="btn-time-close" type="button" class="glass-btn rounded-full w-9 h-9 flex items-center justify-center text-[15px] ml-1" aria-label="Close timeline">✕</button>
      </div>
    </div>

    <div id="time-era-tabs" class="flex items-center gap-2 overflow-x-auto no-scrollbar"></div>

    <div id="timeline-ruler" class="timeline-ruler" role="slider" aria-label="Chronological Year Ruler" aria-valuemin="-1800" aria-valuemax="2045" aria-valuenow="-580">
      <div class="timeline-track"></div>
      <div id="timeline-fill" class="timeline-fill" style="width: 12%"></div>
      <div id="timeline-dots"></div>
      <div id="timeline-needle" class="timeline-needle" style="left: 12%"></div>
    </div>

    <div id="timeline-event-strip" class="flex items-stretch gap-2.5 overflow-x-auto no-scrollbar pb-1"></div>
  </section>

  <!-- CENTERED WORKSPACE WINDOW -->
  <div id="drawer-backdrop" class="hidden fixed inset-0 z-[55] modal-backdrop flex items-center justify-center p-5">
    <section id="drawer-modal" role="dialog" aria-modal="true" class="w-full max-w-[680px] max-h-[min(82dvh,740px)] liquid-glass rounded-[28px] flex flex-col overflow-hidden">
      <div class="px-6 py-4 border-b border-white/10 flex items-center justify-between gap-4 shrink-0">
        <h3 id="modal-title" class="text-[20px] font-semibold text-white">Explore</h3>
        <button id="btn-close-modal" type="button" aria-label="Close window" class="glass-btn rounded-full w-9 h-9 flex items-center justify-center text-[14px]">✕</button>
      </div>
      <div id="modal-body" class="p-6 scroll-clean flex-1"></div>
    </section>
  </div>

  <!-- CENTERED AUTHENTICATION WINDOW -->
  <div id="auth-modal-backdrop" class="hidden fixed inset-0 z-[70] modal-backdrop flex items-center justify-center p-5">
    <section id="auth-modal" role="dialog" aria-modal="true" aria-labelledby="auth-modal-heading" class="liquid-glass rounded-[28px] w-full max-w-[456px] max-h-[90dvh] flex flex-col overflow-hidden">
      <div class="px-6 pt-6 pb-4 border-b border-white/10 flex items-start justify-between gap-4">
        <div>
          <div class="text-[14px] font-medium accent-text">Account</div>
          <h2 id="auth-modal-heading" class="text-[20px] font-semibold text-white mt-1">Sign in</h2>
          <p id="auth-modal-sub" class="text-[14px] text-neutral-400 mt-1">Save bookmarks, folders, and notes.</p>
        </div>
        <button id="btn-close-auth" type="button" aria-label="Close" class="glass-btn rounded-full w-9 h-9 flex items-center justify-center text-[14px] shrink-0">✕</button>
      </div>
      <div id="auth-modal-body" class="p-6 scroll-clean space-y-5"></div>
    </section>
  </div>

  <!-- Clean Bottom-Left Globe Controls (desktop & laptops >=1024px, controlled in app.css) -->
  <div id="earth-only-controls" class="z-[35] liquid-pill rounded-full p-1.5 items-center gap-1">
    <button id="btn-arcs" type="button" class="glass-btn-active rounded-full px-3 py-1.5 text-[14px]">Arcs</button>
    <button id="btn-labels" type="button" class="glass-btn rounded-full px-3 py-1.5 text-[14px]">Labels</button>
    <button id="btn-tilt" type="button" class="glass-btn rounded-full px-3 py-1.5 text-[14px]">3D</button>
  </div>

  <!-- Symmetrical Bottom Floating Dock (Desktop Two-Half Capsule / Mobile Sculpted Capsule Tab Bar) -->
  <nav id="bottom-dock" aria-label="Primary atlas navigation" class="liquid-pill">
    <div class="dock-type-group" role="group" aria-label="Filter by institution type">
      <button type="button" data-group-tab="all" class="glass-btn-active dock-btn">All</button>
      <button type="button" data-group-tab="lab" class="glass-btn dock-btn">Labs</button>
      <button type="button" data-group-tab="uni" class="glass-btn dock-btn">Unis</button>
      <button type="button" data-group-tab="company" class="glass-btn dock-btn">Startups</button>
    </div>

    <div class="dock-divider" aria-hidden="true"></div>

    <div class="dock-explore-group" role="group" aria-label="Explore modes">
      <button id="btn-mobile-filters" type="button" class="glass-btn dock-btn dock-mobile-only" aria-label="Filter institutions">
        <span class="dock-icon-wrap">
          <i data-lucide="sliders-horizontal" class="dock-icon"></i>
          <span id="mobile-filter-dot" class="hidden dock-filter-dot" aria-hidden="true"></span>
        </span>
        <span class="dock-label">Filter</span>
      </button>
      <button id="btn-toggle-time" type="button" class="glass-btn dock-btn">
        <i data-lucide="clock" class="dock-icon"></i>
        <span class="dock-label">Timeline</span>
      </button>
      <button id="btn-open-domains" type="button" class="glass-btn dock-btn">
        <i data-lucide="atom" class="dock-icon"></i>
        <span class="dock-label">Domains</span>
      </button>
      <button id="btn-open-countries" type="button" class="glass-btn dock-btn">
        <i data-lucide="globe-2" class="dock-icon"></i>
        <span class="dock-label">Countries</span>
      </button>
      <button id="btn-open-pathways" type="button" class="glass-btn dock-btn">
        <i data-lucide="bookmark" class="dock-icon"></i>
        <span class="dock-label">Saved</span>
      </button>
    </div>
  </nav>

  <!-- Vertical Zoom & Reset View Capsule positioned cleanly ABOVE Esri attribution -->
  <div id="zoom-controls" class="fixed bottom-[58px] right-5 z-[35] liquid-pill rounded-full p-1.5 flex flex-col items-center gap-1.5">
    <button id="btn-zoom-in" type="button" class="glass-btn zoom-btn rounded-full w-9 h-9 flex items-center justify-center text-[17px]" title="Zoom In" aria-label="Zoom In">+</button>
    <button id="btn-zoom-out" type="button" class="glass-btn zoom-btn rounded-full w-9 h-9 flex items-center justify-center text-[17px]" title="Zoom Out" aria-label="Zoom Out">−</button>
    <div class="zoom-divider" aria-hidden="true"></div>
    <button id="btn-reset-view" type="button" class="glass-btn rounded-full w-9 h-9 flex items-center justify-center" title="Reset View (0)" aria-label="Reset globe view">
      <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
    </button>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
