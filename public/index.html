<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#030509" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PhysAlts" />
  <meta name="description" content="PhysAlts — Global 3D interactive atlas of physics departments, national labs, private deep-tech startups, historical eras (1800 BCE to future), and space missions out to ~1 light-day." />
  <title>PhysAlts — World of Physics</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link href="./vendor/maplibre-gl.css" rel="stylesheet" />
  <link href="./vendor/tailwind.css" rel="stylesheet" />
  <link href="./styles/app.css" rel="stylesheet" />
  <script src="./vendor/lucide.min.js"></script>
  <script src="./vendor/maplibre-gl-csp.js"></script>
</head>
<body>
  <!-- 3D Earth Satellite Globe -->
  <div id="map" aria-label="Interactive 3D Satellite Physics Globe"></div>

  <!-- Space Frontier View: Earth (0 ls) → Moon → Planets → Voyager (~1 Light-Day) -->
  <div id="space-frontier-view" class="space-hidden" aria-label="Space Frontier Explorer from Earth to 1 Light-Day">
    <canvas id="space-canvas" class="w-full h-full block"></canvas>

    <!-- Space Zone Selector Bar -->
    <div class="fixed left-4 md:left-[404px] right-4 md:right-[224px] top-[156px] md:top-[18px] z-20 flex flex-col items-start md:items-center gap-2">
      <div id="space-zone-pills" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar max-w-full py-0.5"></div>
    </div>

    <!-- Desktop Mission Navigator Rail (Zero Canvas Label Clutter) -->
    <aside id="space-mission-rail" class="fixed top-[72px] right-4 bottom-[78px] w-[290px] z-20 liquid-glass rounded-[24px] flex flex-col overflow-hidden">
      <div class="px-4 py-3 border-b border-white/10 shrink-0">
        <div class="text-[13.5px] font-semibold text-white">Space Frontier Directory</div>
        <div class="text-[11.5px] text-white/55 mt-0.5">Earth (0 ls) to Voyager 1 (~1 light-day)</div>
      </div>
      <div id="space-mission-list" class="p-2.5 space-y-1.5 scroll-clean flex-1"></div>
    </aside>
  </div>

  <!-- Toast notification -->
  <div id="toast" class="liquid-pill rounded-full px-4 py-2 text-[13px] font-medium text-white">
    <span id="toast-text">Ready</span>
  </div>

  <!-- Top-Left: Universal Search + Career Stage + Verified Index Badge -->
  <div id="top-left-bar" class="fixed top-4 left-4 z-[35] flex flex-col gap-2 w-[380px] max-w-[calc(100vw-20px)]">
    <div class="relative">
      <div class="liquid-pill rounded-full px-3.5 py-2 flex items-center gap-2">
        <i data-lucide="search" class="w-4 h-4 text-white/55 shrink-0"></i>
        <input
          id="search-input"
          type="text"
          autocomplete="off"
          placeholder="Search CERN, 1800 BCE, Voyager, Iceland, PsiQuantum..."
          class="bg-transparent border-0 outline-none text-[13.5px] text-white placeholder-white/45 flex-1 min-w-0"
        />
        <button id="btn-explore" type="button" class="glass-btn rounded-full px-3 py-1 text-[12px] flex items-center gap-1 shrink-0">
          <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
          <span>Explore</span>
        </button>
      </div>
      <div id="search-dropdown" class="hidden absolute left-0 right-0 top-full mt-2 liquid-glass rounded-[22px] p-2 max-h-[62vh] scroll-clean z-[60] panel-animate"></div>
    </div>

    <div class="flex flex-wrap items-center gap-2">
      <div class="relative">
        <button id="stage-dropdown-btn" type="button" class="liquid-pill rounded-full px-3 py-1.5 min-h-[34px] flex items-center gap-1.5 text-[12px] text-white/90 hover:bg-white/10 transition cursor-pointer">
          <i data-lucide="graduation-cap" class="w-3.5 h-3.5 text-white/65"></i>
          <span class="text-white/55">Stage:</span>
          <span id="stage-current-label" class="font-medium text-white">Undergrad</span>
          <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-white/55"></i>
        </button>
        <div id="stage-dropdown-menu" role="listbox" class="hidden absolute left-0 top-full mt-2 w-[220px] liquid-glass rounded-[20px] p-1.5 z-[60] space-y-0.5 panel-animate"></div>
      </div>

      <button id="db-status-pill" type="button" class="liquid-pill rounded-full px-3 py-1.5 min-h-[34px] flex items-center gap-2 text-[12px] text-white/85 hover:bg-white/10 transition cursor-pointer" title="Open Verification Audit & GDPR Controls">
        <span id="db-dot" class="w-2 h-2 rounded-full bg-sky-300"></span>
        <span id="db-status-text">Loading index…</span>
        <i data-lucide="shield-check" class="w-3.5 h-3.5 text-sky-200/80"></i>
      </button>

      <div id="active-filter-pill" class="hidden liquid-pill rounded-full px-3 py-1 flex items-center gap-1.5 text-[11.5px] text-sky-100">
        <span id="active-filter-text"></span>
        <button id="btn-clear-filters" type="button" class="hover:text-white cursor-pointer" aria-label="Clear filters">✕</button>
      </div>
    </div>
  </div>

  <!-- Top-Right: Earth <-> Space Frontier Switcher + Globe Controls -->
  <div id="top-right-controls" class="fixed top-4 right-4 z-[35] flex items-center gap-2">
    <div class="liquid-pill rounded-full p-1 flex items-center gap-1">
      <button id="btn-mode-earth" type="button" class="glass-btn-active rounded-full px-3 py-1 text-[12px] flex items-center gap-1.5">
        <i data-lucide="globe" class="w-3.5 h-3.5"></i>
        <span>Earth</span>
      </button>
      <button id="btn-mode-space" type="button" class="glass-btn rounded-full px-3 py-1 text-[12px] flex items-center gap-1.5" title="Explore Earth → Moon → Planets → ~1 Light-Day">
        <i data-lucide="orbit" class="w-3.5 h-3.5"></i>
        <span>1 Light-Day</span>
      </button>
    </div>

    <div id="earth-only-controls" class="hidden md:flex liquid-pill rounded-full p-1 items-center gap-1">
      <button id="btn-arcs" type="button" class="glass-btn-active rounded-full px-3 py-1 text-[12px]">Arcs</button>
      <button id="btn-labels" type="button" class="glass-btn rounded-full px-3 py-1 text-[12px]">Labels</button>
      <button id="btn-tilt" type="button" class="glass-btn rounded-full px-3 py-1 text-[12px]">3D Tilt</button>
      <button id="btn-reset-space" type="button" class="glass-btn rounded-full px-3 py-1 text-[12px]">Reset</button>
    </div>
  </div>

  <!-- Place / Timeline / Space Mission Detail Card -->
  <aside id="place-card" class="hidden fixed top-[148px] left-4 z-[38] w-[390px] max-w-[calc(100vw-20px)] max-h-[calc(100vh-230px)] liquid-glass rounded-[26px] overflow-hidden flex flex-col panel-animate">
    <div id="card-photo-wrap" class="relative h-[132px] w-full bg-white/[0.03] shrink-0 overflow-hidden">
      <img id="card-photo" class="w-full h-full object-cover opacity-0 transition-opacity duration-300" alt="" />
      <div id="card-photo-fallback" class="absolute inset-0 flex items-center justify-center text-white/35 text-[12px]">
        Verified institution record
      </div>
      <div class="absolute inset-0 bg-gradient-to-t from-[#0b0e15] via-transparent to-black/25"></div>
    </div>

    <button id="btn-close-card" type="button" aria-label="Close card" class="absolute top-3 right-3 z-10 glass-btn rounded-full w-8 h-8 flex items-center justify-center text-[13px]">✕</button>

    <div class="p-4 space-y-3 scroll-clean">
      <div>
        <div id="card-badge" class="text-[11.5px] font-medium text-sky-200/85 pr-9"></div>
        <h2 id="card-title" class="text-[18px] font-semibold text-white leading-snug mt-0.5"></h2>
        <div id="card-sub" class="text-[12.5px] text-white/60 mt-0.5"></div>
      </div>

      <p id="card-summary" class="text-[13px] text-white/85 leading-relaxed"></p>

      <div class="rounded-2xl bg-white/[0.05] border border-white/10 p-3">
        <div id="card-pathway-label" class="section-label"></div>
        <p id="card-pathway" class="text-[12.5px] text-white/90 mt-1 leading-relaxed"></p>
      </div>

      <div id="card-extra-chips" class="flex flex-wrap gap-1.5"></div>

      <div id="card-links" class="flex flex-wrap gap-1.5 pt-0.5"></div>

      <div class="flex items-center gap-2 pt-1">
        <button id="btn-save-shortlist" type="button" class="glass-btn rounded-full px-3.5 py-1.5 text-[12px]">+ Save to Shortlist</button>
        <button id="btn-deeper-toggle" type="button" class="glass-btn rounded-full px-3.5 py-1.5 text-[12px]">Go Deeper ↓</button>
      </div>

      <div id="card-deeper-wrap" class="hidden space-y-3 border-t border-white/10 pt-3">
        <div>
          <div class="section-label mb-1.5">Recent Physics Papers (OpenAlex)</div>
          <div id="deeper-papers" class="space-y-1.5"></div>
        </div>
        <div>
          <div class="section-label mb-1.5">Top Cited Physicists &amp; PIs</div>
          <div id="deeper-authors" class="space-y-1.5"></div>
        </div>
        <div>
          <div class="section-label mb-1.5">All 7 Career Stages</div>
          <div id="deeper-stages" class="space-y-1.5"></div>
        </div>
      </div>
    </div>
  </aside>

  <!-- Museum-Grade Chronological Physics Timeline (1800 BCE → 2045 CE) -->
  <section id="time-bar" class="hidden fixed bottom-[76px] inset-x-0 mx-auto z-[36] w-[820px] max-w-[calc(100vw-24px)] liquid-glass rounded-[26px] p-4 space-y-3 panel-animate" aria-label="Chronological Physics Timeline">
    <div class="flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-baseline gap-3 min-w-0">
        <span id="time-year-display" class="text-[20px] font-semibold text-white tabular-nums tracking-tight shrink-0">580 BCE</span>
        <span id="time-era-title" class="text-[13px] font-medium text-sky-200/90 truncate">Pre-Classical &amp; Ancient Foundations</span>
        <span id="time-visible-count" class="text-[11.5px] text-white/50 hidden sm:inline shrink-0"></span>
      </div>
      <div class="flex items-center gap-1.5 shrink-0">
        <button id="btn-time-prev" type="button" class="glass-btn rounded-full w-7 h-7 flex items-center justify-center text-[12px]" title="Previous milestone">←</button>
        <button id="btn-time-play" type="button" class="glass-btn rounded-full px-3 py-1 text-[11.5px] font-medium">Play Tour</button>
        <button id="btn-time-next" type="button" class="glass-btn rounded-full w-7 h-7 flex items-center justify-center text-[12px]" title="Next milestone">→</button>
        <button id="btn-time-close" type="button" class="glass-btn rounded-full w-7 h-7 flex items-center justify-center text-[12px] ml-1" aria-label="Exit timeline">✕</button>
      </div>
    </div>

    <!-- Era Filter Tabs -->
    <div id="time-era-tabs" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar"></div>

    <!-- Custom Precision Calibrated Ruler (No default browser range slider) -->
    <div id="timeline-ruler" class="timeline-ruler" role="slider" aria-label="Chronological Year Ruler" aria-valuemin="-1800" aria-valuemax="2045" aria-valuenow="-580">
      <div class="timeline-track"></div>
      <div id="timeline-fill" class="timeline-fill" style="width: 12%"></div>
      <div id="timeline-dots"></div>
      <div id="timeline-needle" class="timeline-needle" style="left: 12%"></div>
    </div>

    <!-- Synchronized Milestone Story Strip -->
    <div id="timeline-event-strip" class="flex items-stretch gap-2 overflow-x-auto no-scrollbar pb-0.5"></div>
  </section>

  <!-- Drawer Modal (Domains/Materials, Countries & Deep-Tech, Live Search, Pathways, Audit/GDPR) -->
  <section id="drawer-modal" class="hidden fixed bottom-[76px] right-4 z-[45] w-[540px] max-w-[calc(100vw-20px)] max-h-[72vh] liquid-glass rounded-[26px] flex flex-col overflow-hidden panel-animate">
    <div class="px-5 py-3.5 border-b border-white/10 flex items-center justify-between gap-3 shrink-0">
      <h3 id="modal-title" class="text-[15px] font-semibold text-white">Explore</h3>
      <button id="btn-close-modal" type="button" aria-label="Close panel" class="glass-btn rounded-full w-8 h-8 flex items-center justify-center text-[13px]">✕</button>
    </div>
    <div id="modal-body" class="p-4 scroll-clean flex-1"></div>
  </section>

  <!-- Bottom Floating Dock -->
  <nav id="bottom-dock" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-[35] liquid-pill rounded-full p-1.5 flex items-center gap-1 no-scrollbar">
    <button type="button" data-group-tab="all" class="glass-btn-active rounded-full px-3.5 py-1.5 text-[12.5px] whitespace-nowrap">All</button>
    <button type="button" data-group-tab="lab" class="glass-btn rounded-full px-3 py-1.5 text-[12.5px] whitespace-nowrap">Labs</button>
    <button type="button" data-group-tab="uni" class="glass-btn rounded-full px-3 py-1.5 text-[12.5px] whitespace-nowrap">Universities</button>
    <button type="button" data-group-tab="company" class="glass-btn rounded-full px-3 py-1.5 text-[12.5px] whitespace-nowrap">Private &amp; Startups</button>

    <div class="w-px h-5 bg-white/15 mx-1 shrink-0"></div>

    <button id="btn-toggle-time" type="button" class="glass-btn rounded-full px-3 py-1.5 text-[12.5px] flex items-center gap-1.5 whitespace-nowrap" title="Explore Physics across Time (1800 BCE → 2045+)">
      <i data-lucide="clock" class="w-3.5 h-3.5"></i>
      <span>Timeline</span>
    </button>
    <button id="btn-open-domains" type="button" class="glass-btn rounded-full px-3 py-1.5 text-[12.5px] flex items-center gap-1.5 whitespace-nowrap">
      <i data-lucide="atom" class="w-3.5 h-3.5"></i>
      <span>Domains</span>
    </button>
    <button id="btn-open-countries" type="button" class="glass-btn rounded-full px-3 py-1.5 text-[12.5px] flex items-center gap-1.5 whitespace-nowrap">
      <i data-lucide="flag" class="w-3.5 h-3.5"></i>
      <span>Countries</span>
    </button>
    <button id="btn-open-live" type="button" class="glass-btn rounded-full px-3 py-1.5 text-[12.5px] flex items-center gap-1.5 whitespace-nowrap">
      <i data-lucide="radar" class="w-3.5 h-3.5"></i>
      <span>Live Search</span>
    </button>
    <button id="btn-open-pathways" type="button" class="glass-btn rounded-full px-3 py-1.5 text-[12.5px] flex items-center gap-1.5 whitespace-nowrap">
      <i data-lucide="bookmark" class="w-3.5 h-3.5"></i>
      <span>Pathways</span>
    </button>
  </nav>

  <!-- Bottom-Right Zoom Controls -->
  <div id="zoom-controls" class="fixed bottom-4 right-4 z-[35] liquid-pill rounded-full p-1 flex items-center gap-1">
    <button id="btn-zoom-in" type="button" class="glass-btn rounded-full w-8 h-8 flex items-center justify-center" title="Zoom In" aria-label="Zoom In">+</button>
    <button id="btn-zoom-out" type="button" class="glass-btn rounded-full w-8 h-8 flex items-center justify-center" title="Zoom Out" aria-label="Zoom Out">−</button>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
