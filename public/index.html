<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050506" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="World of Physics" />
  <meta name="description" content="Interactive 3D atlas of global physics laboratories, universities, deep-tech startups, historical discoveries (1800 BCE–2045), and space missions to 1 light-day." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="World of Physics" />
  <meta property="og:description" content="Discover official physics laboratories, universities, startups, historical milestones, and space missions out to 1 light-day." />
  <title>World of Physics</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="preconnect" href="https://services.arcgisonline.com" crossorigin />
  <link rel="preload" href="./vendor/inter-var.woff2" as="font" type="font/woff2" crossorigin />
  <link href="./vendor/maplibre-gl.css" rel="stylesheet" />
  <link href="./vendor/tailwind.css" rel="stylesheet" />
  <link href="./styles/app.css" rel="stylesheet" />
  <script src="./vendor/lucide.min.js"></script>
  <script src="./vendor/maplibre-gl-csp.js"></script>
</head>
<body>
  <!-- Living Deep-Space Starfield Backdrop -->
  <canvas id="space-bg-canvas" aria-hidden="true"></canvas>

  <!-- 3D Earth Satellite Globe -->
  <div id="map" aria-label="Interactive 3D Satellite Physics Globe"></div>

  <!-- Space Frontier View: Earth (0 ls) → Moon → Planets → Voyager (~1 Light-Day) -->
  <div id="space-frontier-view" class="space-hidden" aria-label="Space Frontier Explorer from Earth to 1 Light-Day">
    <canvas id="space-canvas" class="w-full h-full block"></canvas>

    <!-- Space Zone Filter Bar centered neatly below Dynamic Island -->
    <div class="fixed inset-x-0 top-[92px] z-20 flex justify-center px-5 pointer-events-none">
      <div id="space-zone-pills" class="pointer-events-auto liquid-pill rounded-full px-2 py-1.5 flex items-center gap-1.5 overflow-x-auto no-scrollbar max-w-full"></div>
    </div>

    <!-- Desktop Mission Directory Rail -->
    <aside id="space-mission-rail" class="fixed top-[154px] right-6 bottom-[98px] w-[332px] z-20 liquid-glass rounded-[26px] flex flex-col overflow-hidden">
      <div class="px-5 py-4 border-b border-white/10 shrink-0">
        <div class="text-[17px] font-semibold text-white">Space Missions</div>
        <div class="text-[14px] text-neutral-400 mt-0.5">Earth to 1 Light-Day</div>
      </div>
      <div id="space-mission-list" class="p-3 space-y-2 scroll-clean flex-1"></div>
    </aside>
  </div>

  <!-- Toast Notification -->
  <div id="toast" role="status" aria-live="polite" class="liquid-pill rounded-full px-4 py-2 text-[14px] font-medium text-white max-w-[min(420px,calc(100vw-32px))] truncate">
    <span id="toast-text">Ready</span>
  </div>

  <!-- SCULPTURAL CENTERED DYNAMIC ISLAND -->
  <header id="dynamic-island" class="liquid-pill rounded-full px-2 sm:px-2.5 py-1.5 w-auto max-w-[calc(100vw-20px)] overflow-x-auto no-scrollbar">
    <div class="flex items-center gap-1.5 sm:gap-2">
      <!-- Spotlight Search Trigger -->
      <button id="btn-open-spotlight" type="button" title="Search anything (⌘K or /)" class="glass-btn rounded-full px-3 sm:px-3.5 py-2 text-[14px] flex items-center gap-2 shrink-0">
        <i data-lucide="search" class="w-4 h-4 text-neutral-300 shrink-0"></i>
        <span class="text-neutral-200 whitespace-nowrap">Search</span>
        <kbd class="hidden lg:inline-flex items-center px-1.5 py-0.5 rounded bg-white/[0.08] text-[12px] text-neutral-400">⌘K</kbd>
      </button>

      <!-- Rabbit Hole Curiosity Jump Button -->
      <button id="btn-rabbit-hole" type="button" title="Rabbit Hole — jump to a discovery (R)" class="glass-btn rounded-full px-3 sm:px-3.5 py-2 text-[14px] flex items-center gap-2 shrink-0">
        <i data-lucide="sparkles" class="w-4 h-4 accent-text shrink-0"></i>
        <span class="hidden md:inline whitespace-nowrap font-medium text-white">Rabbit Hole</span>
      </button>

      <!-- Earth / 1 Light-Day Switcher -->
      <div class="flex items-center gap-1 bg-white/[0.05] rounded-full p-1 shrink-0">
        <button id="btn-mode-earth" type="button" title="Earth Globe (click again to reset view)" class="glass-btn-active rounded-full px-2.5 lg:px-3.5 py-1.5 text-[14px] flex items-center gap-1.5 whitespace-nowrap">
          <i data-lucide="globe" class="w-4 h-4 shrink-0"></i>
          <span class="hidden lg:inline">Earth</span>
        </button>
        <button id="btn-mode-space" type="button" class="glass-btn rounded-full px-2.5 lg:px-3.5 py-1.5 text-[14px] flex items-center gap-1.5 whitespace-nowrap" title="Space Frontier (0 to 1 Light-Day)">
          <i data-lucide="orbit" class="w-4 h-4 shrink-0"></i>
          <span class="hidden lg:inline">1 Light-Day</span>
        </button>
      </div>

      <!-- Account Sign-In / Profile Pill -->
      <button id="btn-account" type="button" title="Account &amp; Bookmarks" class="glass-btn rounded-full px-3 sm:px-3.5 py-2 flex items-center gap-2 text-[14px] font-medium text-white shrink-0">
        <span id="account-avatar" class="hidden w-5 h-5 rounded-full bg-white text-black text-[12px] font-semibold items-center justify-center shrink-0"></span>
        <i id="account-guest-icon" data-lucide="user" class="w-4 h-4 text-neutral-300 shrink-0"></i>
        <span id="account-btn-label" class="hidden sm:inline whitespace-nowrap">Sign in</span>
        <span id="account-bm-badge" class="hidden px-2 py-0.5 rounded-full bg-white/12 text-[14px] text-neutral-200">0</span>
      </button>
    </div>
  </header>

  <!-- Floating Active Filter Pill (centered cleanly below Dynamic Island, zero island clipping) -->
  <div id="active-filter-pill" class="hidden fixed top-[74px] sm:top-[80px] left-1/2 -translate-x-1/2 z-[40] liquid-pill items-center gap-2 px-3.5 py-1.5 rounded-full text-[14px] text-neutral-100 max-w-[calc(100vw-32px)]">
    <span id="active-filter-text" class="truncate"></span>
    <button id="btn-clear-filters" type="button" class="text-neutral-400 hover:text-white cursor-pointer bg-transparent border-0 p-0 ml-1 shrink-0" aria-label="Clear filter">✕</button>
  </div>

  <!-- CENTERED SPOTLIGHT COMMAND SEARCH WINDOW (Cmd+K / / / Search button) -->
  <div id="spotlight-backdrop" class="hidden fixed inset-0 z-[65] modal-backdrop flex items-start justify-center pt-[12vh] px-5">
    <section id="spotlight-modal" role="dialog" aria-modal="true" aria-label="Spotlight Search" class="w-full max-w-[640px] max-h-[74dvh] liquid-glass rounded-[28px] flex flex-col overflow-hidden">
      <div class="px-6 py-4 border-b border-white/10 flex items-center gap-3.5 shrink-0">
        <i data-lucide="search" class="w-5 h-5 text-neutral-400 shrink-0"></i>
        <input
          id="search-input"
          type="text"
          autocomplete="off"
          aria-label="Search labs, countries, eras, or space missions"
          placeholder="Search labs, countries, 1800 BCE, Voyager…"
          class="bg-transparent border-0 outline-none text-[17px] text-white placeholder-neutral-500 flex-1 min-w-0"
        />
        <button id="btn-spotlight-live" type="button" class="glass-btn rounded-full px-3.5 py-1.5 text-[14px] shrink-0">Live Search</button>
        <button id="btn-close-spotlight" type="button" aria-label="Close search" class="glass-btn rounded-full w-9 h-9 flex items-center justify-center text-[14px] shrink-0">✕</button>
      </div>
      <div id="search-dropdown" class="p-4 scroll-clean flex-1 space-y-2"></div>
    </section>
  </div>

  <!-- Concise Revolving-Door Source Card -->
  <aside id="place-card" class="hidden fixed top-[88px] left-5 z-[38] w-[clamp(332px,33vw,396px)] max-w-[calc(100vw-24px)] max-h-[calc(100dvh-190px)] liquid-glass rounded-[24px] overflow-hidden flex flex-col">
    <div id="card-photo-wrap" class="hidden relative h-[124px] w-full bg-white/[0.03] shrink-0 overflow-hidden">
      <img id="card-photo" class="w-full h-full object-cover opacity-0 transition-opacity duration-300" alt="" />
      <div id="card-photo-fallback" class="absolute inset-0"></div>
      <div class="absolute inset-0 bg-gradient-to-t from-[#101012] via-transparent to-black/20"></div>
    </div>

    <button id="btn-close-card" type="button" aria-label="Close card" class="absolute top-3.5 right-3.5 z-10 glass-btn rounded-full w-8 h-8 flex items-center justify-center text-[14px]">✕</button>

    <div id="card-scroll-body" class="p-5 pb-4 space-y-3.5 scroll-clean min-w-0 flex-1">
      <div class="min-w-0">
        <div id="card-badge" class="text-[14px] font-medium accent-text pr-10 truncate"></div>
        <h2 id="card-title" class="text-[20px] font-semibold text-white leading-snug mt-1 pr-6 break-words"></h2>
        <div id="card-sub" class="text-[14px] text-neutral-400 mt-0.5 truncate"></div>
      </div>

      <p id="card-summary" class="text-[15px] text-neutral-200 leading-relaxed line-clamp-2"></p>

      <!-- Official Primary Doors -->
      <div id="card-links" class="flex flex-wrap items-center gap-x-3 gap-y-2"></div>

      <!-- Connected Rabbit Hole Portals -->
      <div id="card-rabbit-wrap" class="hidden space-y-2 pt-0.5 min-w-0">
        <div class="section-label">Keep Exploring</div>
        <div id="card-rabbit-links" class="flex flex-wrap gap-1.5 min-w-0"></div>
      </div>

      <div id="card-extra-chips" class="flex flex-wrap gap-1.5 min-w-0"></div>

      <!-- Optional Expanded Details -->
      <div id="card-deeper-wrap" class="hidden space-y-4 border-t border-white/10 pt-4">
        <div class="rounded-2xl bg-white/[0.04] border border-white/10 p-4">
          <div id="card-pathway-label" class="section-label"></div>
          <p id="card-pathway" class="text-[14px] text-neutral-200 mt-1.5 leading-relaxed"></p>
        </div>
        <div>
          <div class="section-label mb-2">Recent Papers</div>
          <div id="deeper-papers" class="space-y-2"></div>
        </div>
        <div>
          <div class="section-label mb-2">Key Researchers</div>
          <div id="deeper-authors" class="space-y-2"></div>
        </div>
        <div>
          <div class="section-label mb-2">Academic Stages</div>
          <div id="deeper-stages" class="space-y-2"></div>
        </div>
      </div>
    </div>

    <div class="card-actions flex items-center gap-1.5 px-5 py-3 border-t border-white/10 shrink-0 bg-black/20">
      <button id="btn-save-shortlist" type="button" class="glass-btn card-action" title="Bookmark">
        <i data-lucide="bookmark" class="w-3.5 h-3.5 shrink-0"></i><span>Save</span>
      </button>
      <button id="btn-card-rabbit" type="button" class="glass-btn card-action" title="Next discovery">
        <i data-lucide="shuffle" class="w-3.5 h-3.5 accent-text shrink-0"></i><span>Next</span>
      </button>
      <button id="btn-copy-link" type="button" class="glass-btn card-action" title="Copy share link">
        <i data-lucide="share-2" class="w-3.5 h-3.5 shrink-0"></i><span>Share</span>
      </button>
      <button id="btn-deeper-toggle" type="button" class="glass-btn card-action" title="More details">
        <i data-lucide="chevron-down" class="w-3.5 h-3.5 shrink-0"></i><span>More</span>
      </button>
    </div>
  </aside>

  <!-- Centered Chronological Timeline (1800 BCE → 2045 CE) -->
  <section id="time-bar" class="hidden fixed bottom-[96px] inset-x-0 mx-auto z-[36] w-[min(860px,calc(100vw-32px))] liquid-glass rounded-[26px] p-5 space-y-3.5" aria-label="Chronological Physics Timeline">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-baseline gap-3.5 min-w-0">
        <span id="time-year-display" class="text-[24px] font-semibold text-white tabular-nums tracking-tight shrink-0">580 BCE</span>
        <span id="time-era-title" class="text-[15px] font-medium accent-text truncate">Pre-Classical &amp; Ancient Foundations</span>
        <span id="time-visible-count" class="hidden"></span>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <button id="btn-time-prev" type="button" class="glass-btn rounded-full w-9 h-9 flex items-center justify-center text-[15px]" title="Previous">←</button>
        <button id="btn-time-play" type="button" class="glass-btn rounded-full px-4 py-1.5 text-[14px] font-medium">Play Tour</button>
        <button id="btn-time-next" type="button" class="glass-btn rounded-full w-9 h-9 flex items-center justify-center text-[15px]" title="Next">→</button>
        <button id="btn-time-close" type="button" class="glass-btn rounded-full w-9 h-9 flex items-center justify-center text-[15px] ml-1" aria-label="Close timeline">✕</button>
      </div>
    </div>

    <div id="time-era-tabs" class="flex items-center gap-2 overflow-x-auto no-scrollbar"></div>

    <div id="timeline-ruler" class="timeline-ruler" role="slider" aria-label="Chronological Year Ruler" aria-valuemin="-1800" aria-valuemax="2045" aria-valuenow="-580">
      <div class="timeline-track"></div>
      <div id="timeline-fill" class="timeline-fill" style="width: 12%"></div>
      <div id="timeline-dots"></div>
      <div id="timeline-needle" class="timeline-needle" style="left: 12%"></div>
    </div>

    <div id="timeline-event-strip" class="flex items-stretch gap-2.5 overflow-x-auto no-scrollbar pb-1"></div>
  </section>

  <!-- CENTERED WORKSPACE WINDOW -->
  <div id="drawer-backdrop" class="hidden fixed inset-0 z-[55] modal-backdrop flex items-center justify-center p-5">
    <section id="drawer-modal" role="dialog" aria-modal="true" class="w-full max-w-[680px] max-h-[min(82dvh,740px)] liquid-glass rounded-[28px] flex flex-col overflow-hidden">
      <div class="px-6 py-4 border-b border-white/10 flex items-center justify-between gap-4 shrink-0">
        <h3 id="modal-title" class="text-[20px] font-semibold text-white">Explore</h3>
        <button id="btn-close-modal" type="button" aria-label="Close window" class="glass-btn rounded-full w-9 h-9 flex items-center justify-center text-[14px]">✕</button>
      </div>
      <div id="modal-body" class="p-6 scroll-clean flex-1"></div>
    </section>
  </div>

  <!-- CENTERED AUTHENTICATION WINDOW -->
  <div id="auth-modal-backdrop" class="hidden fixed inset-0 z-[70] modal-backdrop flex items-center justify-center p-5">
    <section id="auth-modal" role="dialog" aria-modal="true" aria-labelledby="auth-modal-heading" class="liquid-glass rounded-[28px] w-full max-w-[456px] max-h-[90dvh] flex flex-col overflow-hidden">
      <div class="px-6 pt-6 pb-4 border-b border-white/10 flex items-start justify-between gap-4">
        <div>
          <div class="text-[14px] font-medium accent-text">Account</div>
          <h2 id="auth-modal-heading" class="text-[20px] font-semibold text-white mt-1">Sign in</h2>
          <p id="auth-modal-sub" class="text-[14px] text-neutral-400 mt-1">Save bookmarks, folders, and notes.</p>
        </div>
        <button id="btn-close-auth" type="button" aria-label="Close" class="glass-btn rounded-full w-9 h-9 flex items-center justify-center text-[14px] shrink-0">✕</button>
      </div>
      <div id="auth-modal-body" class="p-6 scroll-clean space-y-5"></div>
    </section>
  </div>

  <!-- Clean Bottom-Left Globe Controls (wide desktop only, clear of centered dock) -->
  <div id="earth-only-controls" class="hidden min-[1360px]:flex fixed bottom-5 left-5 z-[35] liquid-pill rounded-full p-1.5 items-center gap-1">
    <button id="btn-arcs" type="button" class="glass-btn-active rounded-full px-3 py-1.5 text-[14px]">Arcs</button>
    <button id="btn-labels" type="button" class="glass-btn rounded-full px-3 py-1.5 text-[14px]">Labels</button>
    <button id="btn-tilt" type="button" class="glass-btn rounded-full px-3 py-1.5 text-[14px]">3D</button>
  </div>

  <!-- Centered Bottom Floating Dock -->
  <nav id="bottom-dock" aria-label="Primary atlas navigation" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-[35] liquid-pill rounded-full p-1.5 flex items-center gap-1 lg:gap-1.5 max-w-[calc(100vw-24px)] overflow-x-auto no-scrollbar">
    <button type="button" data-group-tab="all" class="glass-btn-active dock-btn">All</button>
    <button type="button" data-group-tab="lab" class="glass-btn dock-btn">Labs</button>
    <button type="button" data-group-tab="uni" class="glass-btn dock-btn">Universities</button>
    <button type="button" data-group-tab="company" class="glass-btn dock-btn">Startups</button>

    <div class="w-px h-5 bg-white/12 mx-0.5 lg:mx-1 shrink-0"></div>

    <button id="btn-toggle-time" type="button" class="glass-btn dock-btn">
      <i data-lucide="clock" class="w-4 h-4 hidden lg:inline-block shrink-0"></i>
      <span>Timeline</span>
    </button>
    <button id="btn-open-domains" type="button" class="glass-btn dock-btn">
      <i data-lucide="atom" class="w-4 h-4 hidden lg:inline-block shrink-0"></i>
      <span>Domains</span>
    </button>
    <button id="btn-open-countries" type="button" class="glass-btn dock-btn">
      <i data-lucide="globe-2" class="w-4 h-4 hidden lg:inline-block shrink-0"></i>
      <span>Countries</span>
    </button>
    <button id="btn-open-pathways" type="button" class="glass-btn dock-btn">
      <i data-lucide="bookmark" class="w-4 h-4 hidden lg:inline-block shrink-0"></i>
      <span>Bookmarks</span>
    </button>
  </nav>

  <!-- Vertical Zoom Capsule positioned cleanly ABOVE Esri attribution (0px overlap) -->
  <div id="zoom-controls" class="fixed bottom-[56px] right-5 z-[35] liquid-pill rounded-full p-1.5 flex flex-col items-center gap-1.5">
    <button id="btn-zoom-in" type="button" class="glass-btn rounded-full w-9 h-9 flex items-center justify-center text-[17px]" title="Zoom In" aria-label="Zoom In">+</button>
    <button id="btn-zoom-out" type="button" class="glass-btn rounded-full w-9 h-9 flex items-center justify-center text-[17px]" title="Zoom Out" aria-label="Zoom Out">−</button>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
