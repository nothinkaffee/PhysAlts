name: Build Android & iOS Native Apps

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "public/**"
      - "android/**"
      - "ios/**"
      - "capacitor.config.json"
      - ".github/workflows/build-mobile-apps.yml"

permissions:
  contents: read

concurrency:
  group: "mobile-apps-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies & sync Capacitor
        run: |
          npm ci
          npx cap sync android

      - name: Build Android Debug APK & Release AAB
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android assembleDebug bundleRelease

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorldOfPhysics-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Android Release Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: WorldOfPhysics-android-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

  ios:
    name: Build iOS App (Xcode)
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies & sync Capacitor iOS
        run: |
          npm ci
          npx cap sync ios

      - name: Build unsigned iOS Archive (Xcode)
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -archivePath build/WorldOfPhysics.xcarchive \
            archive

      - name: Package unsigned IPA for sideloading / re-signing
        run: |
          mkdir -p ios/App/build/Payload
          cp -R ios/App/build/WorldOfPhysics.xcarchive/Products/Applications/App.app ios/App/build/Payload/
          cd ios/App/build
          zip -qr WorldOfPhysics-ios-unsigned.ipa Payload

      - name: Upload iOS Unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorldOfPhysics-ios-unsigned-ipa
          path: ios/App/build/WorldOfPhysics-ios-unsigned.ipa
          retention-days: 30
