name: Build Android & iOS Native Apps

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "public/**"
      - "android/**"
      - "ios/**"
      - "capacitor.config.json"
      - ".github/workflows/build-mobile-apps.yml"

permissions:
  contents: read

concurrency:
  group: "mobile-apps-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies & sync lean Capacitor Android bundle
        run: |
          npm ci
          npx cap sync android
          node scripts/prune_native_assets.mjs

      - name: Build Android Debug APK & Release AAB
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android assembleDebug bundleRelease
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/upload-keystore.jks
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore /tmp/upload-keystore.jks \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -keypass "${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}" \
              android/app/build/outputs/bundle/release/app-release.aab "$ANDROID_KEY_ALIAS"
            rm -f /tmp/upload-keystore.jks
            echo "Signed Android AAB with release upload keystore."
          else
            echo "No signing secrets configured; outputting unsigned release AAB."
          fi

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: WorldOfPhysics-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Android Release Bundle (AAB)
        uses: actions/upload-artifact@v7
        with:
          name: WorldOfPhysics-android-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

  ios:
    name: Build iOS App (Xcode)
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies & sync lean Capacitor iOS bundle
        run: |
          npm ci
          npx cap sync ios
          node scripts/prune_native_assets.mjs

      - name: Build unsigned iOS Archive (Xcode)
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -archivePath build/WorldOfPhysics.xcarchive \
            archive

      - name: Package unsigned IPA for sideloading / re-signing
        run: |
          mkdir -p ios/App/build/Payload
          cp -R ios/App/build/WorldOfPhysics.xcarchive/Products/Applications/App.app ios/App/build/Payload/
          cd ios/App/build
          zip -qr WorldOfPhysics-ios-unsigned.ipa Payload

      - name: Upload iOS Unsigned IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: WorldOfPhysics-ios-unsigned-ipa
          path: ios/App/build/WorldOfPhysics-ios-unsigned.ipa
          retention-days: 30
